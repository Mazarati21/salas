---
deployment:
  tasks:
    - /bin/mkdir -p /home/legendzc/salas/tools /home/legendzc/salas/vendor /home/legendzc/salas/assets /home/legendzc/salas/data/backups /home/legendzc/salas/tmp /home/legendzc/public_html/salas /home/legendzc/public_html/status /home/legendzc/public_html/bans
    - /bin/bash -lc 'source /home/legendzc/nodevenv/salas/20/bin/activate && npm ci --include=dev && npm run release:verify'
    - /usr/bin/touch /home/legendzc/public_html/salas/.htaccess
    - /bin/cp -f app.js app.jsx index.html package.json package-lock.json server.js styles.css theme.js /home/legendzc/salas/
    - /bin/cp -f tools/build-app.js tools/data-store.js tools/teamspeak-query.js tools/diagnostics.js tools/release-guard.js tools/restore-backup.js /home/legendzc/salas/tools/
    - /bin/cp -f tools/admin-utils.js tools/room-activity.js tools/server-metrics.js /home/legendzc/salas/tools/
    - /bin/cp -f vendor/react.production.min.js vendor/react-dom.production.min.js /home/legendzc/salas/vendor/
    - /bin/mkdir -p /home/legendzc/salas/assets/fonts
    - /bin/cp -f assets/background-light.png assets/background-dark.png assets/background-light-v3.png assets/background-dark-v3.png assets/favicon.svg /home/legendzc/salas/assets/
    - /bin/cp -f assets/fonts/manrope-latin.woff2 assets/fonts/sora-latin.woff2 /home/legendzc/salas/assets/fonts/
    - /bin/cp -f homepage/index.html /home/legendzc/public_html/index.html
    - /bin/cp -f status/index.html /home/legendzc/public_html/status/index.html
    - /bin/cp -f status/.htaccess /home/legendzc/public_html/status/.htaccess
    - /bin/cp -f bans/index.html /home/legendzc/public_html/bans/index.html
    - /bin/cp -f bans/.htaccess /home/legendzc/public_html/bans/.htaccess
    - /bin/cp -f public/legendz.css public/legendz.js public/legendz-theme.js /home/legendzc/public_html/
    - /bin/bash -lc '/bin/grep -q "LegendZ security headers" /home/legendzc/public_html/.htaccess 2>/dev/null || /bin/cat deploy/public-root-headers.htaccess >> /home/legendzc/public_html/.htaccess'
    - /bin/bash -lc '( /usr/bin/crontab -l 2>/dev/null | /bin/grep -Fv "legendz-status-collector"; /bin/echo "*/5 * * * * /usr/bin/curl -fsS --max-time 20 https://legendzcommunity.com/salas/api/status?source=legendz-status-collector >/dev/null 2>&1" ) | /usr/bin/crontab -'
    - /bin/bash -lc 'source /home/legendzc/nodevenv/salas/20/bin/activate && cd /home/legendzc/salas && npm ci --omit=dev'
    - /usr/bin/touch /home/legendzc/salas/tmp/restart.txt
